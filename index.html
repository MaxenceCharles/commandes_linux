<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aide-Mémoire Commandes Linux Éditable</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        /* Editable fields highlight */
        [contenteditable="true"]:hover {
            outline: 2px dashed #38bdf8;
            outline-offset: 2px;
            border-radius: 4px;
            cursor: pointer;
        }
        [contenteditable="true"]:focus {
            outline: 2px solid #38bdf8;
            outline-offset: 2px;
            background-color: #1e293b;
            border-radius: 4px;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        /* Code styling badges */
        .cmd-badge {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            background-color: #1e1e2e;
            color: #f38ba8;
            border: 1px solid #f38ba833;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 600;
        }
        .opt-badge {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            color: #f9e2af;
            font-weight: 600;
        }
        .ex-badge {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            background-color: #111827;
            color: #a6e3a1;
            border: 1px solid #a6e3a133;
            padding: 4px 8px;
            border-radius: 6px;
            display: inline-block;
        }
    </style>
</head>
<body class="min-h-screen pb-12">

    <header class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur border-b border-slate-800 shadow-xl">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                <div class="flex items-center space-x-3">
                    <div class="p-2.5 bg-sky-500/10 text-sky-400 rounded-xl border border-sky-500/20">
                        <i class="fa-solid fa-terminal text-2xl"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold text-slate-100 flex items-center gap-2">
                            Aide-Mémoire Linux
                            <span class="text-xs font-normal px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">Éditable</span>
                        </h1>
                        <p class="text-xs text-slate-400">Cliquez sur n'importe quel texte pour l'éditer en direct</p>
                    </div>
                </div>

                <!-- Action Controls -->
                <div class="flex flex-wrap items-center gap-2">
                    <button id="add-cat-btn" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-medium rounded-lg border border-slate-700 transition flex items-center gap-2">
                        <i class="fa-solid fa-folder-plus text-sky-400"></i> Nouvelle Catégorie
                    </button>
                    <button id="export-json-btn" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-medium rounded-lg border border-slate-700 transition flex items-center gap-2">
                        <i class="fa-solid fa-download text-emerald-400"></i> Exporter (JSON)
                    </button>
                    <label class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-medium rounded-lg border border-slate-700 transition flex items-center gap-2 cursor-pointer">
                        <i class="fa-solid fa-upload text-amber-400"></i> Importer
                        <input type="file" id="import-json-input" accept=".json" class="hidden">
                    </label>
                    <button id="publish-btn" onclick="publishToGitHub()" class="px-3 py-2 bg-sky-600 hover:bg-sky-500 text-white text-sm font-medium rounded-lg shadow-lg shadow-sky-600/20 transition flex items-center gap-2">
                        <i class="fa-solid fa-cloud-arrow-up"></i> Enregistrer sur GitHub
                    </button>
                </div>
            </div>

            <!-- Search and Filter Bar -->
            <div class="mt-4 flex flex-col sm:flex-row gap-3">
                <div class="relative flex-1">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="search-input" placeholder="Rechercher une commande, option, description..." 
                           class="w-full pl-10 pr-4 py-2 bg-slate-950 border border-slate-800 rounded-lg text-slate-200 placeholder-slate-500 focus:outline-none focus:border-sky-500 transition text-sm">
                </div>
                <button id="add-cmd-btn" class="px-4 py-2 bg-sky-600 hover:bg-sky-500 text-white font-medium text-sm rounded-lg shadow-lg shadow-sky-600/20 transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-plus"></i> Ajouter une Commande
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-6">
        <!-- Toast Notification -->
        <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-800 text-slate-100 border border-slate-700 px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3">
            <i id="toast-icon" class="fa-solid fa-check-circle text-emerald-400"></i>
            <span id="toast-msg" class="text-sm">Action effectuée</span>
        </div>

        <!-- Categories and Tables Container -->
        <div id="categories-container" class="space-y-8">
            <!-- Rendered dynamically by JS -->
        </div>
    </main>

    <!-- Modal: Add New Command -->
    <div id="cmd-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg overflow-hidden shadow-2xl">
            <div class="px-6 py-4 border-b border-slate-800 flex justify-between items-center">
                <h3 class="text-lg font-bold text-slate-100 flex items-center gap-2">
                    <i class="fa-solid fa-square-plus text-sky-400"></i> Nouvelle Commande
                </h3>
                <button id="close-cmd-modal" class="text-slate-400 hover:text-slate-200"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="cmd-form" class="p-6 space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Catégorie</label>
                    <select id="modal-category" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-slate-200 focus:outline-none focus:border-sky-500 text-sm" required>
                        <!-- Populated by JS -->
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Commande</label>
                    <input type="text" id="modal-cmd" placeholder="ex: grep" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-slate-200 focus:outline-none focus:border-sky-500 text-sm" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Utilité / Description</label>
                    <input type="text" id="modal-desc" placeholder="ex: Rechercher un motif dans un fichier" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-slate-200 focus:outline-none focus:border-sky-500 text-sm" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Options principales</label>
                    <input type="text" id="modal-options" placeholder="ex: -i (ignore casse), -r (récursif)" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-slate-200 focus:outline-none focus:border-sky-500 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Exemple d'utilisation</label>
                    <input type="text" id="modal-example" placeholder="ex: grep -rn 'erreur' /var/log/" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-slate-200 focus:outline-none focus:border-sky-500 text-sm">
                </div>
                <div class="pt-2 flex justify-end gap-3">
                    <button type="button" id="cancel-cmd-modal" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm rounded-lg">Annuler</button>
                    <button type="submit" class="px-4 py-2 bg-sky-600 hover:bg-sky-500 text-white font-medium text-sm rounded-lg shadow-lg shadow-sky-600/20">Ajouter</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Add New Category -->
    <div id="cat-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md overflow-hidden shadow-2xl">
            <div class="px-6 py-4 border-b border-slate-800 flex justify-between items-center">
                <h3 class="text-lg font-bold text-slate-100 flex items-center gap-2">
                    <i class="fa-solid fa-folder-plus text-sky-400"></i> Nouvelle Catégorie
                </h3>
                <button id="close-cat-modal" class="text-slate-400 hover:text-slate-200"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="cat-form" class="p-6 space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Nom de la Catégorie</label>
                    <input type="text" id="modal-cat-name" placeholder="ex: Docker & Conteneurs" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-slate-200 focus:outline-none focus:border-sky-500 text-sm" required>
                </div>
                <div class="pt-2 flex justify-end gap-3">
                    <button type="button" id="cancel-cat-modal" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm rounded-lg">Annuler</button>
                    <button type="submit" class="px-4 py-2 bg-sky-600 hover:bg-sky-500 text-white font-medium text-sm rounded-lg shadow-lg shadow-sky-600/20">Créer</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
<!-- JavaScript Application Logic -->
    <script>
        // State Variables
        let linuxData = [];

        const categoriesContainer = document.getElementById('categories-container');
        const searchInput = document.getElementById('search-input');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toast-msg');

        // Modal Elements
        const cmdModal = document.getElementById('cmd-modal');
        const catModal = document.getElementById('cat-modal');
        const addCmdBtn = document.getElementById('add-cmd-btn');
        const addCatBtn = document.getElementById('add-cat-btn');
        const closeCmdModal = document.getElementById('close-cmd-modal');
        const cancelCmdModal = document.getElementById('cancel-cmd-modal');
        const closeCatModal = document.getElementById('close-cat-modal');
        const cancelCatModal = document.getElementById('cancel-cat-modal');
        const cmdForm = document.getElementById('cmd-form');
        const catForm = document.getElementById('cat-form');
        const modalCategorySelect = document.getElementById('modal-category');

        // CONFIGURATION GITHUB
        const GITHUB_CONFIG = {
            owner: "MaxenceCharles", 
            repo: "commandes_linux",    
            filePath: "data.json",
            branch: "main"                 
        };

        // 1. CHARGEMENT DES DONNÉES DEPUIS GITHUB
        async function initData() {
                        
            try {
                const res = await fetch(`./data.json?t=${Date.now()}`);
                if (res.ok) {
                    linuxData = await res.json();
                    localStorage.setItem('linux_memo_data', JSON.stringify(linuxData));
                } else {
                    throw new Error("Impossible de charger data.json depuis GitHub");
                }
            } catch (e) {
                console.error("Erreur de chargement, tentative via le cache local :", e);
                const saved = localStorage.getItem('linux_memo_data');
                if (saved) linuxData = JSON.parse(saved);
            }
            renderApp();
        }

        // 2. SAUVEGARDE EN MÉMOIRE LOCALE LORS DES ÉDITIONS
        function saveData() {
            localStorage.setItem('linux_memo_data', JSON.stringify(linuxData));
        }

        // 3. PUBLICATION DIRECTE SUR GITHUB (SANS NETLIFY)
        async function publishToGitHub() {
            let token = localStorage.getItem('gh_pat_token');

            if (!token) {
                token = prompt("Entre ton Personal Access Token GitHub (ghp_... ou github_pat_...) :");
                if (!token) return showToast("Publication annulée (token requis)", true);
                token = token.trim();
                localStorage.setItem('gh_pat_token', token);
            }

            showToast("Publication sur GitHub...");

            const apiUrl = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.filePath}`;

            try {
                // 1. Récupération du SHA (GET)
                const getRes = await fetch(`${apiUrl}?ref=${GITHUB_CONFIG.branch}`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });

                if (getRes.status === 401 || getRes.status === 403) {
                    localStorage.removeItem('gh_pat_token');
                    return showToast("Token invalide ou droits insuffisants (401/403)", true);
                }

                if (!getRes.ok) {
                    throw new Error(`Erreur récupération SHA: ${getRes.status}`);
                }

                const fileData = await getRes.json();
                const sha = fileData.sha;

                // 2. Encodage Base64 UTF-8
                const contentJson = JSON.stringify(linuxData, null, 2);
                const bytes = new TextEncoder().encode(contentJson);
                const binString = String.fromCharCode(...bytes);
                const contentBase64 = btoa(binString);

                // 3. Écriture du fichier (PUT) avec en-têtes stricts GitHub API v3
                const putRes = await fetch(apiUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: "Mise à jour de l'aide-mémoire depuis le site",
                        content: contentBase64,
                        sha: sha,
                        branch: GITHUB_CONFIG.branch
                    })
                });

                if (putRes.ok) {
                    showToast("Enregistré sur GitHub avec succès !");
                } else {
                    const err = await putRes.json();
                    showToast("Erreur GitHub : " + (err.message || putRes.status), true);
                }
            } catch (err) {
                console.error("Détail de l'erreur :", err);
                showToast("Erreur réseau/CORS lors de la publication", true);
            }
        }

        function showToast(message, isError = false) {
            toastMsg.textContent = message;
            const icon = document.getElementById('toast-icon');
            if (isError) {
                icon.className = "fa-solid fa-triangle-exclamation text-rose-400";
            } else {
                icon.className = "fa-solid fa-check-circle text-emerald-400";
            }
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        function renderApp() {
            const query = searchInput.value.toLowerCase().trim();
            categoriesContainer.innerHTML = '';

            let matchesCount = 0;

            linuxData.forEach((category) => {
                const filteredCommands = category.commands.filter(cmd => 
                    cmd.name.toLowerCase().includes(query) ||
                    cmd.desc.toLowerCase().includes(query) ||
                    cmd.options.toLowerCase().includes(query) ||
                    cmd.example.toLowerCase().includes(query)
                );

                if (query && filteredCommands.length === 0) return;

                matchesCount += filteredCommands.length;

                const catCard = document.createElement('div');
                catCard.className = "bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-lg transition";

                const catHeader = document.createElement('div');
                catHeader.className = "px-6 py-4 bg-slate-900/60 border-b border-slate-800 flex flex-wrap items-center justify-between gap-3";
                
                catHeader.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span contenteditable="true" data-cat-id="${category.id}" class="cat-title-edit text-lg font-bold text-sky-400 hover:bg-slate-800/50 px-2 py-1 rounded">
                            ${escapeHTML(category.name)}
                        </span>
                        <span class="text-xs text-slate-500 bg-slate-800 px-2.5 py-1 rounded-full font-medium">
                            ${filteredCommands.length} commande${filteredCommands.length > 1 ? 's' : ''}
                        </span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="openAddCmdModal('${category.id}')" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white px-2.5 py-1.5 rounded-lg border border-slate-700 transition flex items-center gap-1.5">
                            <i class="fa-solid fa-plus text-sky-400"></i> Commande
                        </button>
                        <button onclick="deleteCategory('${category.id}')" class="text-xs bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 px-2.5 py-1.5 rounded-lg border border-rose-500/20 transition flex items-center gap-1.5">
                            <i class="fa-solid fa-trash-can"></i> Supprimer
                        </button>
                    </div>
                `;

                catCard.appendChild(catHeader);

                const tableContainer = document.createElement('div');
                tableContainer.className = "overflow-x-auto";

                const table = document.createElement('table');
                table.className = "w-full text-left border-collapse";

                table.innerHTML = `
                    <thead>
                        <tr class="border-b border-slate-800 text-[11px] font-semibold text-slate-400 uppercase tracking-wider bg-slate-950/40">
                            <th class="py-3 px-6 w-1/6">Commande</th>
                            <th class="py-3 px-6 w-2/6">Utilité</th>
                            <th class="py-3 px-6 w-2/6">Options utiles</th>
                            <th class="py-3 px-6 w-2/6">Exemple</th>
                            <th class="py-3 px-4 w-12 text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-800/60 text-sm">
                    </tbody>
                `;

                const tbody = table.querySelector('tbody');

                filteredCommands.forEach(cmd => {
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-slate-800/40 transition group";

                    tr.innerHTML = `
                        <td class="py-3.5 px-6 font-mono">
                            <span contenteditable="true" data-cmd-id="${cmd.id}" data-field="name" class="cmd-badge cmd-field-edit">
                                ${escapeHTML(cmd.name)}
                            </span>
                        </td>
                        <td class="py-3.5 px-6 text-slate-200">
                            <span contenteditable="true" data-cmd-id="${cmd.id}" data-field="desc" class="cmd-field-edit block hover:bg-slate-800/50 p-1 rounded">
                                ${escapeHTML(cmd.desc)}
                            </span>
                        </td>
                        <td class="py-3.5 px-6 text-amber-200/90 font-mono text-xs">
                            <span contenteditable="true" data-cmd-id="${cmd.id}" data-field="options" class="opt-badge cmd-field-edit block hover:bg-slate-800/50 p-1 rounded">
                                ${escapeHTML(cmd.options)}
                            </span>
                        </td>
                        <td class="py-3.5 px-6 font-mono">
                            <span contenteditable="true" data-cmd-id="${cmd.id}" data-field="example" class="ex-badge cmd-field-edit hover:bg-slate-800/50">
                                ${escapeHTML(cmd.example)}
                            </span>
                        </td>
                        <td class="py-3.5 px-4 text-center">
                            <button onclick="deleteCommand('${category.id}', '${cmd.id}')" class="opacity-0 group-hover:opacity-100 text-slate-500 hover:text-rose-400 p-1.5 transition">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </td>
                    `;

                    tbody.appendChild(tr);
                });

                tableContainer.appendChild(table);
                catCard.appendChild(tableContainer);
                categoriesContainer.appendChild(catCard);
            });

            if (matchesCount === 0 && query !== '') {
                categoriesContainer.innerHTML = `
                    <div class="text-center py-12 bg-slate-900/50 border border-slate-800 rounded-2xl">
                        <i class="fa-solid fa-magnifying-glass text-4xl text-slate-600 mb-3"></i>
                        <p class="text-slate-400 text-base font-medium">Aucune commande trouvée pour "${escapeHTML(query)}"</p>
                        <p class="text-xs text-slate-500 mt-1">Essayez un autre mot-clé ou ajoutez la commande.</p>
                    </div>
                `;
            }

            attachEditableListeners();
        }

        function escapeHTML(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function attachEditableListeners() {
            document.querySelectorAll('.cat-title-edit').forEach(elem => {
                elem.addEventListener('blur', (e) => {
                    const catId = e.target.getAttribute('data-cat-id');
                    const newTitle = e.target.innerText.trim();
                    const cat = linuxData.find(c => c.id === catId);
                    if (cat && newTitle) {
                        cat.name = newTitle;
                        saveData();
                        showToast("Catégorie mise à jour");
                    }
                });
            });

            document.querySelectorAll('.cmd-field-edit').forEach(elem => {
                elem.addEventListener('blur', (e) => {
                    const cmdId = e.target.getAttribute('data-cmd-id');
                    const field = e.target.getAttribute('data-field');
                    const newValue = e.target.innerText.trim();

                    for (let cat of linuxData) {
                        let cmd = cat.commands.find(c => c.id === cmdId);
                        if (cmd) {
                            cmd[field] = newValue;
                            saveData();
                            showToast("Modifications enregistrées");
                            break;
                        }
                    }
                });

                elem.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        e.target.blur();
                    }
                });
            });
        }

        function deleteCommand(catId, cmdId) {
            const cat = linuxData.find(c => c.id === catId);
            if (cat) {
                cat.commands = cat.commands.filter(c => c.id !== cmdId);
                saveData();
                renderApp();
                showToast("Commande supprimée");
            }
        }

        function deleteCategory(catId) {
            if (confirm("Voulez-vous vraiment supprimer cette catégorie et toutes ses commandes ?")) {
                linuxData = linuxData.filter(c => c.id !== catId);
                saveData();
                renderApp();
                showToast("Catégorie supprimée");
            }
        }

        function populateCategorySelect() {
            modalCategorySelect.innerHTML = '';
            linuxData.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat.id;
                opt.textContent = cat.name;
                modalCategorySelect.appendChild(opt);
            });
        }

        function openAddCmdModal(selectedCatId = null) {
            populateCategorySelect();
            if (selectedCatId) {
                modalCategorySelect.value = selectedCatId;
            }
            cmdModal.classList.remove('hidden');
        }

        closeCmdModal.onclick = () => cmdModal.classList.add('hidden');
        cancelCmdModal.onclick = () => cmdModal.classList.add('hidden');
        closeCatModal.onclick = () => catModal.classList.add('hidden');
        cancelCatModal.onclick = () => catModal.classList.add('hidden');

        addCmdBtn.onclick = () => openAddCmdModal();
        addCatBtn.onclick = () => catModal.classList.remove('hidden');

        cmdForm.onsubmit = (e) => {
            e.preventDefault();
            const catId = modalCategorySelect.value;
            const name = document.getElementById('modal-cmd').value.trim();
            const desc = document.getElementById('modal-desc').value.trim();
            const options = document.getElementById('modal-options').value.trim() || "-";
            const example = document.getElementById('modal-example').value.trim() || name;

            const cat = linuxData.find(c => c.id === catId);
            if (cat) {
                cat.commands.push({
                    id: "cmd_" + Date.now(),
                    name,
                    desc,
                    options,
                    example
                });
                saveData();
                renderApp();
                cmdModal.classList.add('hidden');
                cmdForm.reset();
                showToast("Nouvelle commande ajoutée !");
            }
        };

        catForm.onsubmit = (e) => {
            e.preventDefault();
            const name = document.getElementById('modal-cat-name').value.trim();
            if (name) {
                linuxData.push({
                    id: "cat_" + Date.now(),
                    name,
                    commands: []
                });
                saveData();
                renderApp();
                catModal.classList.add('hidden');
                catForm.reset();
                showToast("Nouvelle catégorie créée !");
            }
        };

        document.getElementById('export-json-btn').onclick = () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(linuxData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `memo_linux_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast("Sauvegarde exportée !");
        };

        document.getElementById('import-json-input').onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const importedData = JSON.parse(event.target.result);
                    if (Array.isArray(importedData)) {
                        linuxData = importedData;
                        saveData();
                        renderApp();
                        showToast("Données importées avec succès !");
                    } else {
                        showToast("Format de fichier invalide", true);
                    }
                } catch (err) {
                    showToast("Erreur lors de la lecture du fichier JSON", true);
                }
            };
            reader.readAsText(file);
        };

        searchInput.addEventListener('input', () => {
            renderApp();
        });

        window.onload = () => {
            initData();
        };
    </script>
</body>
</html>
